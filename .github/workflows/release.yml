name: Release

# Ein Tag `v*` ist der Auslöser für ein Release — sonst nichts. Der reguläre
# CI-Lauf (build.yml) baut die Pakete zwar auch, veröffentlicht sie aber nie;
# beides zugleich würde denselben Release doppelt bespielen.
on:
  push:
    tags: ['v*']
  # Zum Nachholen, falls ein Lauf hängengeblieben ist: Tag von Hand eintragen.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, z. B. v1.0.0'
        required: true

# Die Jobs legen den Release an und hängen die Pakete daran.
permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  pruefen:
    name: Tests und Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # electron-builder benennt die Pakete nach der Version aus der
      # package.json. Maßgeblich ist aber der Tag: er steht am Release und in
      # den Downloadlinks. Deshalb wird die Version vor dem Bau aus dem Tag
      # gesetzt (siehe Job „bauen“), statt den Lauf abzubrechen, wenn beides
      # auseinanderläuft — ein Release an einem sonst fehlerfreien Stand soll
      # nicht an einer vergessenen Zeile in der package.json scheitern.
      #
      # Was der Tag dagegen hergeben muss, ist eine brauchbare Versionsnummer:
      # electron-builder verlangt semver, und die Nummer landet im Dateinamen.
      - name: Version aus dem Tag ableiten
        id: version
        shell: bash
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG ergibt keine gültige Versionsnummer. Erwartet wird v<major>.<minor>.<patch>, z. B. v1.1.0."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release $TAG wird als Version $version gebaut."
          paket=$(node -p "require('./package.json').version")
          if [ "$paket" != "$version" ]; then
            echo "::notice::In der package.json steht $paket; für diesen Lauf gilt $version aus dem Tag."
          fi

  entwurf:
    name: Release-Entwurf anlegen
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      # Der Entwurf entsteht vor den Bauläufen, damit macOS und Windows ihre
      # Pakete in denselben Release hängen. Legte ihn jeder Job selbst an,
      # entstünden bei gleichzeitigem Lauf zwei Entwürfe zum selben Tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Entwurf anlegen, falls noch keiner besteht
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG besteht bereits — wird weiterverwendet."
            exit 0
          fi
          # Ein Tag mit Suffix (v1.0.0-beta.1) wird als Vorabversion markiert.
          vorab=()
          case "$TAG" in *-*) vorab=(--prerelease);; esac
          gh release create "$TAG" \
            --draft \
            --title "SOLA Ordnerstruktur ${TAG#v}" \
            --generate-notes \
            "${vorab[@]}"

  bauen:
    name: ${{ matrix.name }}
    needs: [pruefen, entwurf]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (dmg, arm64 + x64)
            plattform: mac
          - os: windows-latest
            name: Windows (Setup + portable exe)
            plattform: win
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Nach `npm ci`, nicht davor: npm vergleicht package.json und
      # package-lock.json und stolpert über eine Version, die nur in einer von
      # beiden Dateien steht. Auf den Bau selbst wirkt die Reihenfolge nicht —
      # electron-builder liest die package.json erst beim Paketieren.
      - name: Version aus dem Tag in die package.json schreiben
        shell: bash
        run: |
          npm pkg set version="$VERSION"
          echo "Gebaut wird Version $(node -p "require('./package.json').version")."

      # electron-builder wird direkt aufgerufen, nicht über `npm run`: npm
      # würde `--publish` als eigenes Flag schlucken und nur den Wert
      # weiterreichen, den electron-builder dann als Bauziel liest.
      #
      # `--publish never`: Hochgeladen wird im Schritt darunter von Hand. Der
      # eingebaute Publisher sucht sich seinen Release selbst und lädt neben
      # den Paketen auch `.blockmap` und `latest-*.yml` hoch, die für eine App
      # ohne Selbstaktualisierung niemand braucht. Mit `gh release upload`
      # steht dagegen genau fest, welche Dateien am Release landen — und der
      # Schritt scheitert sichtbar, wenn es die falschen sind.
      #
      # Ohne Signaturzertifikate entstehen unsignierte Pakete. Das ist gewollt —
      # die Installationshinweise stehen in der README.
      #
      # electron-builder holt NSIS- und Signierwerkzeuge zur Bauzeit aus dem
      # Netz. Dieser Host antwortet gelegentlich mit 503 oder bricht die
      # Verbindung ab — beides hat hier schon Builds gekippt, die inhaltlich in
      # Ordnung waren. Ein einzelner Fehlschlag ist deshalb kein Ergebnis,
      # sondern ein Grund für einen neuen Anlauf.
      - name: Pakete bauen
        shell: bash
        run: |
          set -o pipefail
          for versuch in 1 2 3; do
            if npx electron-builder --${{ matrix.plattform }} --publish never; then
              exit 0
            fi
            if [ "$versuch" -eq 3 ]; then
              echo "::error::electron-builder ist in drei Anläufen gescheitert."
              exit 1
            fi
            wartezeit=$((versuch * 20))
            echo "::warning::Anlauf $versuch fehlgeschlagen, neuer Versuch in ${wartezeit}s."
            # Halbfertige Ausgaben wegräumen, damit der nächste Anlauf sauber startet.
            rm -rf dist
            sleep "$wartezeit"
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # `nullglob` ist nötig, weil je nach Plattform nur eines der beiden
      # Muster zutrifft; ohne die Option würde die Schleife über das
      # unaufgelöste Muster stolpern.
      #
      # `--clobber` ersetzt eine gleichnamige Datei, die von einem
      # abgebrochenen früheren Lauf am Release hängt. Ohne die Option bräche
      # jeder Wiederholungslauf mit „asset already exists“ ab.
      - name: Pakete an den Release hängen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          pakete=(dist/*.dmg dist/*.exe)
          if [ ${#pakete[@]} -eq 0 ]; then
            echo "::error::Es wurde kein Paket gebaut."
            exit 1
          fi
          ls -lh "${pakete[@]}"
          gh release upload "$TAG" "${pakete[@]}" --clobber
          echo "Hochgeladen: ${pakete[*]}"

  veroeffentlichen:
    name: Release veröffentlichen
    needs: [pruefen, bauen]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.pruefen.outputs.version }}
    steps:
      # Erst wenn beide Plattformen geliefert haben, wird aus dem Entwurf ein
      # sichtbarer Release. Bricht ein Bau ab, bleibt der Entwurf liegen und
      # niemand lädt ein halbes Release herunter.
      - name: Vollständigkeit prüfen und Entwurf freigeben
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          vorhanden=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Am Release hängen:"; echo "$vorhanden"

          # Geprüft wird, was am Ende zählt: zwei .dmg (arm64 und x64) und zwei
          # .exe (Installer und portable), alle mit der Version aus dem Tag im
          # Namen. Die genauen Namen legt electron-builder über `artifactName`
          # in der package.json fest — sie hier ein zweites Mal auszuschreiben
          # hieße, dieselbe Regel an zwei Stellen zu pflegen; weicht eine ab,
          # bliebe ein vollständiges Release grundlos liegen.
          dmg=$(grep -c -E "^SOLA-Ordnerstruktur-$VERSION[-.].*\\.dmg$" <<<"$vorhanden" || true)
          exe=$(grep -c -E "^SOLA-Ordnerstruktur-$VERSION[-.].*\\.exe$" <<<"$vorhanden" || true)
          echo "Gefunden: $dmg .dmg, $exe .exe zur Version $VERSION."

          fehlt=0
          if [ "$dmg" -lt 2 ]; then
            echo "::error::Es hängen $dmg .dmg-Dateien zur Version $VERSION am Release, erwartet werden zwei (arm64 und x64)."
            fehlt=1
          fi
          if [ "$exe" -lt 2 ]; then
            echo "::error::Es hängen $exe .exe-Dateien zur Version $VERSION am Release, erwartet werden zwei (Setup und portable)."
            fehlt=1
          fi
          [ "$fehlt" -eq 0 ] || exit 1

          gh release edit "$TAG" --draft=false
          echo "Release $TAG ist veröffentlicht."
